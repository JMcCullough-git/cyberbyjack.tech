baseURL = "https://cybersealreport.com/"
title = "The Cyber Seal Report"
copyright = "Cyber Seal Report"
enableRobotsTXT = true
# Show tag names exactly as written (osint stays osint, then tag-name.html formats it).
capitalizeListTitles = false
# Publishing is manual (draft: false + sync), so a future date never hides a post.
buildFuture = true
# Content written in Obsidian lives in content/; ignore Obsidian/editor clutter there.
ignoreFiles = ['\.obsidian', '\.trash', '(^|/)Untitled( \d+)?\.md$']

# Fail fast with a clear message if the build server runs an older Hugo.
[module.hugoVersion]
  extended = true
  min = "0.146.0"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[permalinks]
  [permalinks.page]
    posts = "/posts/:contentbasename/"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser]
    # An image on its own line becomes a <figure> (see layouts/_markup/render-image.html).
    wrapStandAloneImageWithinParagraph = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  author = "Jack McCullough"
  description = "Independent reporting, technical analysis, and field notes on the stories behind cybersecurity."
  disclaimer = "Every article is human-written, not AI-generated."

  # About page contact block. Leave a value empty ("") to hide that line.
  contactEmail = "jack@cybersealreport.com"
  pgpFingerprint = ""

  # Topic tags shown under "What I cover" on the About page. Use the same spelling as post tags
  # (lowercase-with-hyphens); each links to its tag page once a post uses it.
  topics = ["threat-research", "vulnerabilities", "investigations", "tooling", "data-breaches", "phishing-scams", "social-engineering", "privacy", "OSINT", "malware"]

  [params.newsletter]
    # Kit inline form 10042907 (Kit → Grow → Landing Pages & Forms).
    # Empty action = the signup card shows "Signups open soon" and can't be submitted.
    action = "https://app.kit.com/forms/10042907/subscriptions"
    # Name of the email field Kit expects.
    field = "email_address"
    headline = "New research, every other Tuesday."
    finePrint = "No spam. Unsubscribe anytime."

  # Footer links. Leave url empty to hide a link.
  [[params.footerLinks]]
    name = "RSS"
    url = "/index.xml"
  [[params.footerLinks]]
    name = "Disclosure policy"
    url = ""
  [[params.footerLinks]]
    name = "PGP key"
    url = ""

[menus]
  [[menus.main]]
    name = "Articles"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Investigations"
    url = "/tags/investigations/"
    weight = 20
  [[menus.main]]
    name = "Archive"
    pageRef = "/archive"
    weight = 30
